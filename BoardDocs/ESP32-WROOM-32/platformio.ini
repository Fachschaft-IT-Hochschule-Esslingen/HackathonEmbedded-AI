; PlatformIO-Konfiguration: ESP32 WROOM-32 Entwicklungsboard (38 Pins, CP2102)
; Diese Datei ersetzt die platformio.ini in eurem Projekt.
; Anleitung: GettingStarted/README.md

[env:esp32_wroom32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.30-2/platform-espressif32.zip
board = esp32dev
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Kein Port gefunden? CP210x-Treiber installieren (Link in der Board-Doku).
; Upload bricht ab? Langsamer hochladen:
;upload_speed = 115200

;lib_deps =
;    adafruit/Adafruit BME280 Library
