; PlatformIO-Konfiguration: Seeed XIAO ESP32-S3 auf dem XIAO Expansion Board
; Diese Datei ersetzt die platformio.ini in eurem Projekt.
; Mit einem anderen XIAO: "board" anpassen (seeed_xiao_esp32c6), der Rest bleibt gleich.

[env:xiao_expansion]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.30-2/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Bibliotheken für die Bauteile auf dem Expansion Board (wie im Seeed-Wiki)
lib_deps =
    ; OLED-Display SSD1306 (I2C 0x3C)
    olikraus/U8g2
    ; Echtzeituhr PCF8563 (I2C 0x51)
    https://github.com/Bill2462/PCF8563-Arduino-Library.git
