; PlatformIO-Konfiguration: Seeed XIAO ESP32-S3
; Diese Datei ersetzt die platformio.ini in eurem Projekt.
; Anleitung: GettingStarted/README.md

[env:xiao_esp32s3]
; pioarduino = Community-Version der ESP32-Plattform mit Arduino-Kern 3.x.
; Feste Version, damit alle Teams denselben Stand haben.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.30-2/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino

; Serieller Monitor (muss zu Serial.begin(...) im Code passen)
monitor_speed = 115200
; Übersetzt Absturzmeldungen ("Guru Meditation") in lesbare Code-Zeilen
monitor_filters = esp32_exception_decoder

; Bibliotheken: Zeilen einkommentieren bzw. ergänzen, PlatformIO lädt sie beim Bauen.
; Namen findet ihr unter https://registry.platformio.org
;lib_deps =
;    adafruit/Adafruit BME280 Library
;    adafruit/Adafruit SSD1306
