; PlatformIO-Konfiguration: Seeed XIAO ESP32-C6
; Diese Datei ersetzt die platformio.ini in eurem Projekt.
; Anleitung: GettingStarted/README.md

[env:xiao_esp32c6]
; Der ESP32-C6 braucht Arduino-Kern 3.x. Den gibt es in PlatformIO nur über pioarduino,
; die offizielle Plattform "espressif32" kennt dieses Board nicht.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.30-2/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

;lib_deps =
;    adafruit/Adafruit BME280 Library
