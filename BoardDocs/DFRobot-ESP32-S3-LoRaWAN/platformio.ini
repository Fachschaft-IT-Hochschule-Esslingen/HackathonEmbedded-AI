; PlatformIO-Konfiguration: DFRobot ESP32-S3 LoRaWAN Board (DFR1195)
; Diese Datei ersetzt die platformio.ini in eurem Projekt.
; Anleitung: GettingStarted/README.md

[env:dfrobot_esp32s3_lorawan]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.30-2/platform-espressif32.zip
; Für dieses Board gibt es keine eigene Definition. Es nutzt die generische ESP32-S3-Definition,
; angepasst an das verbaute Modul ESP32-S3-WROOM-1-N4 (4 MB Flash, kein PSRAM).
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = default.csv

; Serielle Ausgabe über die USB-C-Buchse (entspricht "USB CDC On Boot: Enabled")
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; LoRa: DFRobot_LoRaWAN_ESP32S3 aus dem DFRobot-Wiki für LoRaWAN (TTN),
; RadioLib für einfache Board-zu-Board-Verbindungen.
;lib_deps =
;    jgromes/RadioLib
