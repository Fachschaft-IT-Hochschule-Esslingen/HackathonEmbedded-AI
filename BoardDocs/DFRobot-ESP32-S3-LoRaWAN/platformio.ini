; PlatformIO-Konfiguration: DFRobot ESP32-S3 LoRaWAN Board (DFR1195)
; Anleitung: GettingStarted/README.md

[env:dfrobot_esp32s3_lorawan]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.30-2/platform-espressif32.zip
; PlatformIO hat keine eigene Board-Definition für dieses Board. Wir nehmen die generische
; ESP32-S3-Definition und stellen sie auf das DFRobot-Board um:
board = esp32-s3-devkitc-1
framework = arduino
; Pinbelegung von DFRobot aus dem Arduino-Kern (LED, Display, LoRa, I2C, SPI)
board_build.variant = dfrobot_lorawan_esp32s3
; Verbautes Modul ESP32-S3-WROOM-1-N4: 4 MB Flash, kein PSRAM
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.flash_mode = dio
board_build.partitions = default.csv

build_flags =
    ; Serielle Ausgabe über die USB-C-Buchse
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_DFROBOT_LORAWAN_ESP32S3
    ; LoRa-Frequenzband für Europa (868 MHz), wird von der DFRobot-Bibliothek gebraucht
    -DREGION_EU868

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    ; DFRobot-Bibliothek für LoRa/LoRaWAN UND das Onboard-Display (LCD_OnBoard)
    https://github.com/DFRobot/DFRobot_LoRaWAN_ESP32S3.git#v1.0.1
