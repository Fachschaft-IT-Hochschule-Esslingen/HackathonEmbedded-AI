; PlatformIO-Konfiguration: ATtiny85 (Ziel-Chip), programmiert über ein zweites Board
; mit dem ArduinoISP-Sketch (siehe Ordner ArduinoISP-Programmer und README.md).
; Diese Datei ersetzt die platformio.ini in eurem ATtiny-Projekt.

[env:attiny85]
platform = atmelavr
board = attiny85
framework = arduino

; Takt: interner Oszillator mit 8 MHz (ohne die Werks-Teilung durch 8)
board_build.f_cpu = 8000000L
; Fuses für 8 MHz intern. Einmalig schreiben mit:  pio run -t fuses
board_fuses.lfuse = 0xE2
board_fuses.hfuse = 0xDF
board_fuses.efuse = 0xFF

; Hochladen über das Programmer-Board ("Arduino as ISP")
upload_protocol = stk500v1
upload_speed = 19200
upload_flags =
    -P$UPLOAD_PORT
    -b$UPLOAD_SPEED
; Port des Programmer-Boards eintragen (Windows z. B. COM5, macOS /dev/cu.usbmodem..., Linux /dev/ttyACM0)
upload_port = COM6
