; PlatformIO-Projekt: XIAO als Programmer ("Arduino as ISP") für den ATtiny85
; Ordner in VS Code öffnen, XIAO anstecken, Upload drücken. Danach ist der XIAO ein Programmer.
; Anleitung: ../README.md
;
; Welcher XIAO? Unten bei default_envs eintragen:
;   xiao_esp32s3_isp  -> XIAO ESP32-S3 (oder S3 Sense)
;   xiao_esp32c6_isp  -> XIAO ESP32-C6
; Die Verkabelung ist bei beiden gleich (D0, D8, D9, D10, 3V3, GND).

[platformio]
default_envs = xiao_esp32c6_isp

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.30-2/platform-espressif32.zip
framework = arduino
monitor_speed = 19200
; Keine Log-Meldungen des ESP32-Kerns: Sie würden auf demselben USB-Port landen
; wie das Programmer-Protokoll und avrdude durcheinanderbringen.
build_flags = -DCORE_DEBUG_LEVEL=0

[env:xiao_esp32s3_isp]
board = seeed_xiao_esp32s3

[env:xiao_esp32c6_isp]
board = seeed_xiao_esp32c6
