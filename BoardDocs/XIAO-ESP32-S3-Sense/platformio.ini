; PlatformIO-Konfiguration: Seeed XIAO ESP32-S3 Sense (Kamera + Mikrofon + microSD)
; Diese Datei ersetzt die platformio.ini in eurem Projekt.
; Anleitung: GettingStarted/README.md

[env:xiao_esp32s3_sense]
; pioarduino = Community-Version der ESP32-Plattform mit Arduino-Kern 3.x.
; Feste Version, damit alle Teams denselben Stand haben.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.30-2/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino

; Die Board-Definition schaltet den 8-MB-PSRAM bereits ein (für die Kamera nötig)
; und reserviert 3,3 MB für euer Programm. Das reicht auch für Kamera und kleine KI-Modelle.

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Kamera (esp_camera.h), Mikrofon (ESP_I2S.h) und SD-Karte (SD.h) sind schon im
; Arduino-Kern enthalten. Weitere Bibliotheken hier eintragen:
;lib_deps =
;    adafruit/Adafruit SSD1306
